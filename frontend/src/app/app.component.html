<app-header *ngIf="showStoreHeader"></app-header>

<div class="page-body-container">
  <app-sidebar
      *ngIf="showSidebar"
      (collapsedStateChanged)="onSidebarToggle($event)">
  </app-sidebar>

  <main class="content-area" [class.sidebar-is-collapsed]="isSidebarCollapsed">
    <router-outlet></router-outlet>
  </main>
</div>

<app-login-required-modal *ngIf="showLoginModal$ | async"></app-login-required-modal>

<app-footer *ngIf="showFooter"></app-footer>
