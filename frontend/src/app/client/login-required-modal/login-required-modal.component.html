<div class="modal-overlay" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="close-button" (click)="close()" aria-label="Cerrar modal">&times;</button>
    <h2>⚠️ Acceso Requerido</h2>
    <p>Para añadir productos al carrito o continuar con tu compra, necesitas iniciar sesión.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" (click)="close()">Cerrar</button>
      <button class="btn btn-primary" (click)="goToLogin()">Iniciar Sesión</button>
    </div>
  </div>
</div>
