<h2>Añadir Nuevo Producto</h2>

<div *ngIf="actionError" class="error-message">
   <p>{{ actionError }}</p>
</div>

<div *ngIf="isLoadingCategories">
  <p>Cargando opciones de categoría...</p>
</div>

<form *ngIf="!isLoadingCategories && productForm" [formGroup]="productForm">

  <div class="form-field">
    <label for="codigo_producto">Código Producto:</label>
    <div class="input-with-icon-button">
       <input id="codigo_producto" type="text" formControlName="codigo_producto">
       <button type="button" class="btn-icon generate-code-btn"
               title="Generar Siguiente Código"
               [disabled]="isGeneratingCode">
         <span class="material-symbols-outlined">{{ isGeneratingCode ? 'sync' : 'autorenew' }}</span>
       </button>
    </div>
     <div *ngIf="productForm.get('codigo_producto')?.invalid && (productForm.get('codigo_producto')?.dirty || productForm.get('codigo_producto')?.touched)" class="validation-error">
      <small *ngIf="productForm.get('codigo_producto')?.errors?.['required']">El código es requerido.</small>
    </div>
  </div>

  <div class="form-field">
    <label for="nombre">Nombre:</label>
    <input id="nombre" type="text" formControlName="nombre">
    <div *ngIf="productForm.get('nombre')?.invalid && (productForm.get('nombre')?.dirty || productForm.get('nombre')?.touched)" class="validation-error">
      <small *ngIf="productForm.get('nombre')?.errors?.['required']">El nombre es requerido.</small>
    </div>
  </div>

  <div class="form-field">
    <label for="precio">Precio:</label>
    <input id="precio" type="number" formControlName="precio">
     <div *ngIf="productForm.get('precio')?.invalid && (productForm.get('precio')?.dirty || productForm.get('precio')?.touched)" class="validation-error">
      <small *ngIf="productForm.get('precio')?.errors?.['required']">El precio es requerido.</small>
      <small *ngIf="productForm.get('precio')?.errors?.['min']">El precio debe ser positivo.</small>
    </div>
  </div>

  <div class="form-field">
    <label for="stock">Stock:</label>
    <input id="stock" type="number" formControlName="stock">
     <div *ngIf="productForm.get('stock')?.invalid && (productForm.get('stock')?.dirty || productForm.get('stock')?.touched)" class="validation-error">
      <small *ngIf="productForm.get('stock')?.errors?.['required']">El stock es requerido.</small>
      <small *ngIf="productForm.get('stock')?.errors?.['min']">El stock debe ser positivo.</small>
    </div>
  </div>

  <div class="form-field">
    <label for="marca">Marca:</label>
    <input id="marca" type="text" formControlName="marca">
  </div>

  <div class="form-field">
    <label for="codigoM">Código M (Ref):</label>
    <input id="codigoM" type="text" formControlName="codigoM">
  </div>

  <div class="form-field">
    <label for="categoria">Categoría:</label>
    <div class="select-wrapper">
      <select id="categoria" formControlName="categoria">
         <option value="" disabled>-- Selecciona Categoría --</option>
         <option *ngFor="let cat of allCategories" [value]="cat.name">
           {{ cat.name }}
         </option>
      </select>
      <span class="material-symbols-outlined select-arrow">arrow_drop_down</span>
    </div>
     <div *ngIf="productForm.get('categoria')?.invalid && (productForm.get('categoria')?.dirty || productForm.get('categoria')?.touched)" class="validation-error">
      <small *ngIf="productForm.get('categoria')?.errors?.['required']">La categoría es requerida.</small>
    </div>
  </div>

  <div class="form-field">
    <label for="subcategoria">Subcategoría:</label>
     <div class="select-wrapper">
      <select id="subcategoria" formControlName="subcategoria"
              [disabled]="filteredSubcategories.length === 0">
         <option value="">-- Selecciona Subcategoría (si aplica) --</option>
         <option *ngFor="let subcat of filteredSubcategories" [value]="subcat.name">
           {{ subcat.name }}
         </option>
      </select>
       <span class="material-symbols-outlined select-arrow">arrow_drop_down</span>
     </div>
   </div>

  <div class="form-field">
    <label for="descripcion">Descripción:</label>
    <textarea id="descripcion" formControlName="descripcion" rows="3"></textarea>
  </div>

   <div class="form-field">
    <label for="imageUrl">URL Imagen:</label>
    <input id="imageUrl" type="url" formControlName="imageUrl">
  </div>

  <div class="form-actions">
    <button type="submit" [disabled]="productForm.invalid || isSaving">
       {{ isSaving ? 'Guardando...' : 'Guardar Producto' }}
    </button>
    <button type="button" (click)="cancel()" [disabled]="isSaving">Cancelar</button>
  </div>

</form>
