<div class="orders-list-container">
  <div class="title-container">
    <h1>Gestión de Órdenes</h1>
  </div>

  <div *ngIf="isLoading" class="loading-indicator">
    <div class="spinner-border text-primary" role="status"></div>
    <span>Cargando órdenes...</span>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="!isLoading && !error && orders.length === 0" class="no-orders-message">
    No hay órdenes para mostrar.
  </div>

  <ul class="order-list" *ngIf="!isLoading && !error && orders.length > 0">
    <li class="order-card" *ngFor="let order of orders">
      <app-order-card [order]="order"></app-order-card>
    </li>
  </ul>
</div>
