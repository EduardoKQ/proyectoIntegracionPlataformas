<div class="modal-overlay" *ngIf="showModal" (click)="onClose()">
  <div class="modal-content" (click)="stopPropagation($event)">
    <button class="close-button" (click)="onClose()">×</button>
    <h2>Elige un modo de entrega</h2>

    <div class="delivery-mode-selector">
      <button class="mode-button"[class.active]="activeMode === 'delivery'"(click)="switchToMode('delivery')">
        🚚 A Domicilio
      </button>
      <button class="mode-button"[class.active]="activeMode === 'pickup'"(click)="switchToMode('pickup')">
        📍 Retiro Pickup
      </button>
    </div>
    <form [formGroup]="addressForm" (ngSubmit)="onSubmit()" *ngIf="activeMode === 'delivery'">
      <div *ngIf="mapOptions" class="map-container mb-3">
        <google-map #mapRef height="250px"  width="100%" [options]="mapOptions" [center]="mapCenter" [zoom]="mapZoom">
          <map-marker *ngIf="markerPosition"  [position]="markerPosition" [options]="markerOptions" (mapDragend)="onMarkerDragEnd($event)">
          </map-marker>
        </google-map>
      </div>

      <p class="text-muted small">Ingresa tu dirección:</p>

      <div class="form-group">
        <label for="autocomplete-input">Dirección Completa <span>*</span></label>
        <input  type="text" id="autocomplete-input" #autocompleteInput class="form-control" placeholder="Ej: Av. Providencia 123, Providencia, Santiago"
          formControlName="fullAddress">
        <div
          *ngIf="addressForm.get('fullAddress')?.invalid && addressForm.get('fullAddress')?.touched" class="error-message">
          Requerido.
        </div>
      </div>

      <div class="form-group">
        <label for="apartment">Depto / oficina / piso</label>
        <input  type="text"  id="apartment" formControlName="apartment" placeholder="Ej: 4 piso, depto 4">
      </div>
      <div class="form-group">
        <label for="instructions">Instrucciones adicionales</label>
        <textarea   id="instructions" formControlName="instructions"  placeholder="Ej: Vivo en la parcela 7 al sur-oeste"></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-guardar" [disabled]="addressForm.invalid">
        Guardar Dirección
      </button>
    </form>

    <form [formGroup]="pickupForm" (ngSubmit)="onSubmit()" *ngIf="activeMode === 'pickup'">
      <div class="pickup-options-list" *ngIf="availableBranches.length > 0; else noBranches">
        <label class="pickup-list-title">Selecciona una sucursal para retirar:</label>
        <div *ngFor="let branch of availableBranches" class="pickup-branch-item" (click)="pickupForm.get('selectedBranchCode')?.setValue(branch.branch_code)"
          [class.selected]="pickupForm.get('selectedBranchCode')?.value === branch.branch_code">
          <input type="radio" name="selectedBranchCode" [value]="branch.branch_code" formControlName="selectedBranchCode"
            [id]="'branch-' + branch.branch_code">
          <div class="branch-details">
            <label [for]="'branch-' + branch.branch_code" class="branch-name">{{ branch.name }}</label>
            <p class="branch-address">{{ branch.address }}</p>
            <p class="branch-pickup-info">✓ Retiro en local</p>
          </div>
        </div>
        <div
          *ngIf="pickupForm.get('selectedBranchCode')?.hasError('required') && pickupForm.get('selectedBranchCode')?.touched"
          class="error-message">
          Debes seleccionar una sucursal.
        </div>
      </div>
      <ng-template #noBranches>
        <p>No hay sucursales de retiro disponibles en este momento.</p>
      </ng-template>
      <button type="submit" class="btn btn-primary btn-guardar" [disabled]="pickupForm.invalid || availableBranches.length === 0">
        Confirmar Retiro
      </button>
    </form>
  </div>
</div>
